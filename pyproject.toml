# pyproject.toml — современный стандарт описания Python-проектов.
# Пришёл на смену setup.py и setup.cfg. Читается pip, poetry, PyCharm и др.

[build-system]
# Что использовать для сборки пакета.
# setuptools — классика, hatchling — современнее. Мы берём hatchling.
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "task-manager-cli"
version = "1.0.0"
description = "Простой менеджер задач для командной строки на Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "r0de0-student", email = "tembi741@mail.ru" },
]
keywords = ["cli", "task-manager", "todo", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]

# Зависимости проекта (то, что нужно для работы программы).
dependencies = [
    "rich>=13.0.0",
]

# Зависимости для разработки (то, что нужно для тестов, линтеров).
# Устанавливаются командой: pip install -e ".[dev]"
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

# Что будет выполнено при вызове команды "task" из терминала.
# Это очень удобно: после pip install -e . можно писать просто "task add ...",
# а не "python main.py add ...".
[project.scripts]
task = "main:main"

# Где искать код пакета.
[tool.hatch.build.targets.wheel]
packages = ["task_manager"]

# Настройки pytest.
[tool.pytest.ini_options]
# testpaths — где искать тесты. Не будет сканировать всю папку.
testpaths = ["tests"]
# verbose вывод по умолчанию.
addopts = "-v"